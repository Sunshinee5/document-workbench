[package]
name = "dw-pdf"
version.workspace = true
edition.workspace = true
description = "PDF Driver 骨架：PDFium（渲染）+ lopdf（对象操作）占位，不写实际逻辑"

[dependencies]
dw-core = { path = "../dw-core" }
# 日志设施（Infrastructure）：只调用分级函数，不引入第三方日志 crate（`05` R18）。
dw-log = { path = "../dw-log" }
lopdf = "0.34"
# 18-02 Parser：Intermediate / ParseContext 需要 serde 派生与 JSON 表达 operands。
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"

# PDFium 绑定与 lopdf 为后续实现依赖：当前不引入，避免骨架阶段拉取难装库。
# pdfium-render = "..."
# lopdf = "..."
